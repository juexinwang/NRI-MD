[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nri-md"
version = "1.0.0"
description = "Neural relational inference to learn allosteric long-range interactions in proteins from molecular dynamics simulations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jingxuan Zhu"},
    {name = "Juexin Wang"},
    {name = "Weiwei Han"},
    {name = "Dong Xu"},
]
keywords = ["neural networks", "graph neural networks", "molecular dynamics", "protein allostery", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "networkx>=2.6.0",
]

[project.optional-dependencies]
cuda118 = [
    "torch==2.0.1+cu118",
    "torchvision==0.15.2+cu118",
    "torchaudio==2.0.2+cu118",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.991",
]

[project.urls]
Homepage = "https://github.com/juexinwang/NRI-MD"
Repository = "https://github.com/juexinwang/NRI-MD"
Documentation = "https://github.com/juexinwang/NRI-MD#readme"
"Bug Tracker" = "https://github.com/juexinwang/NRI-MD/issues"

[project.scripts]
nri-md-train = "nri_md.main:main"
nri-md-convert = "nri_md.convert_dataset:main"
nri-md-visualize = "nri_md.postanalysis_visual:main"
nri-md-path = "nri_md.postanalysis_path:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nri_md*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=nri_md --cov-report=term-missing --cov-report=html"
# Conda environment file for NRI-MD
name: nri-md
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - numpy>=1.21.0
  - scipy>=1.7.0
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - pandas>=1.3.0
  - networkx>=2.6.0
  - pip
  - pip:
    - pytest>=7.0.0
    - pytest-cov>=4.0.0
    - black>=22.0.0
    - flake8>=4.0.0
    - mypy>=0.991